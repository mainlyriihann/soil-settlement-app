<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soil Settlement</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f2421; --muted: #66706a; --line: #dedbd2;
    --accent: #2f6f5e; --accent-text: #ffffff; --warn: #a4552b; --grid: #e8e5dc; --series2: #b5651d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151816; --card: #1e2220; --text: #e8ebe7; --muted: #98a39c; --line: #343a37;
            --accent: #5fb59d; --accent-text: #0f1512; --warn: #e0875a; --grid: #2c322f; --series2: #e0a15e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  select, input { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  #status { margin: 14px 0 0; min-height: 1.5em; color: var(--muted); }
  #status.error { color: var(--warn); white-space: pre-wrap; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .8rem; margin-right: 6px;
           border: 1px solid var(--line); }
  #result { display: none; margin-top: 16px; }
  .answer { font-size: 1.15rem; margin: 0 0 14px; }
  .answer b { font-size: 1.6rem; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .chartbox { position: relative; height: 340px; }
  h2 { font-size: 1rem; margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <h1>Soil settlement calculator</h1>
  <p class="sub">Enter the soil properties to get the U<sub>av</sub>–T<sub>v</sub> curve and the settlement after x years.</p>

  <div class="card">
    <form id="form">
      <div><label for="ks">Permeability ks (m/s)</label><input id="ks" type="number" step="any" required></div>
      <div><label for="mv">Compressibility mv (m²/kN)</label><input id="mv" type="number" step="any" required></div>
      <div><label for="thickness">Soil thickness (m)</label><input id="thickness" type="number" step="any" required></div>
      <div><label for="u0">Initial pore pressure u0 (kN/m²)</label><input id="u0" type="number" step="any" required></div>
      <div><label for="drainage">Drainage</label><select id="drainage"></select></div>
      <div><label for="years">Settlement after (years)</label>
           <input id="years" type="number" min="0" step="any" value="10"></div>
      <div><button id="go" type="submit">Calculate</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <div id="result" class="card">
    <p class="answer" id="answer"></p>
    <div class="charts">
      <div><h2>U<sub>av</sub> vs T<sub>v</sub></h2><div class="chartbox"><canvas id="c1"></canvas></div></div>
      <div><h2>Settlement vs time</h2><div class="chartbox"><canvas id="c2"></canvas></div></div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let data = null, chart1 = null, chart2 = null, polling = null;

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function setStatus(html, isError) {
  $("status").className = isError ? "error" : "";
  $("status").innerHTML = html;
}

// Linear interpolation on the stored (sorted) series.
function interp(x, xs, ys) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; (xs[m] <= x ? (lo = m) : (hi = m)); }
  const f = (x - xs[lo]) / (xs[hi] - xs[lo]);
  return ys[lo] + f * (ys[hi] - ys[lo]);
}

function pairs(xs, ys) { return xs.map((x, i) => ({ x, y: ys[i] })); }

function baseOptions(xTitle, yTitle) {
  const grid = { color: css("--grid") }, ticks = { color: css("--muted") };
  const title = (t) => ({ display: true, text: t, color: css("--muted") });
  return {
    responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
    plugins: { legend: { display: false } },
    scales: { x: { type: "linear", title: title(xTitle), grid, ticks },
              y: { title: title(yTitle), grid, ticks } },
  };
}

function render() {
  if (!data) return;
  const x = parseFloat($("years").value);
  const maxYears = data.max_years;
  const valid = Number.isFinite(x) && x >= 0;
  const s = valid ? interp(x, data.t_years, data.settlement) : null;

  if (!valid) $("answer").textContent = "Enter a number of years (0 or more).";
  else if (x > data.t_years[data.t_years.length - 1])
    $("answer").innerHTML = `Data only covers up to ${maxYears} years. Settlement at the end: <b>${s.toFixed(1)} mm</b>.`;
  else $("answer").innerHTML = `Settlement after ${x} year${x === 1 ? "" : "s"}: <b>${s.toFixed(1)} mm</b>`;

  const accent = css("--accent"), marker = css("--series2");

  // chart 1: Uav vs Tv, Uav increases downwards as in consolidation plots
  if (chart1) chart1.destroy();
  const o1 = baseOptions("Time factor, Tv (log scale)", "Average degree of consolidation, Uav");
  o1.scales.x = { ...o1.scales.x, type: "logarithmic", min: 1e-4 };
  o1.scales.y.reverse = true;
  chart1 = new Chart($("c1"), { type: "line", options: o1, data: { datasets: [
    { data: pairs(data.tv, data.uav), borderColor: accent, borderWidth: 2, pointRadius: 0 },
    ...(data.tv_emp ? [{ data: pairs(data.tv_emp, data.uav_emp), borderColor: marker, borderWidth: 2,
                         borderDash: [6, 4], pointRadius: 0 }] : []) ] } });

  // chart 2: settlement vs time, with the chosen time marked
  if (chart2) chart2.destroy();
  const o2 = baseOptions("Time (years)", "Settlement (mm)");
  o2.scales.y.reverse = true;
  const sets = [{ data: pairs(data.t_years, data.settlement), borderColor: accent, borderWidth: 2, pointRadius: 0 }];
  if (valid) sets.push({ data: [{ x: Math.min(x, data.t_years[data.t_years.length - 1]), y: s }],
                         type: "scatter", backgroundColor: marker, borderColor: marker, pointRadius: 6 });
  chart2 = new Chart($("c2"), { type: "line", options: o2, data: { datasets: sets } });

  $("result").style.display = "block";
}

function showCase(c) {
  if (c.status === "done") {
    clearInterval(polling); $("go").disabled = false;
    data = c.data;
    setStatus(c.cached
      ? `<span class="badge">from database</span>Stored result for this input.`
      : `<span class="badge">computed</span>New result generated and saved.`);
    render();
  } else if (c.status === "failed") {
    clearInterval(polling); $("go").disabled = false;
    setStatus("Calculation failed:\n" + (c.error || "unknown error"), true);
  } else {
    setStatus(`<span class="badge">${c.status === "running" ? "running" : "queued"}</span>` +
              `Not in the database yet - MATLAB is generating it. This page updates automatically.`);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearInterval(polling);
  $("go").disabled = true; setStatus("Checking the database...");
  try {
    const c = await api("/api/cases", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ks: +$("ks").value, mv: +$("mv").value, thickness: +$("thickness").value,
                            u0: +$("u0").value, drainage: $("drainage").value }) });
    showCase(c);
    if (c.status !== "done" && c.status !== "failed") {
      const cached = c.cached;
      polling = setInterval(async () => {
        try { showCase({ ...(await api("/api/cases/" + c.id)), cached }); }
        catch (err) { clearInterval(polling); $("go").disabled = false; setStatus(err.message, true); }
      }, 1500);
    }
  } catch (err) { $("go").disabled = false; setStatus(err.message, true); }
});

// Changing "years" just re-reads the stored curve - no new request.
$("years").addEventListener("input", render);

(async () => {
  try {
    const o = await api("/api/options");
    for (const [id, spec] of Object.entries(o.params)) $(id).value = spec.default;
    $("drainage").innerHTML = o.drainage_types.map((v) => `<option>${v}</option>`).join("");
    if (o.mode === "mock") setStatus("Demo mode: same maths computed in Python, MATLAB is not being used.");
  } catch (err) { setStatus("Cannot reach the backend: " + err.message, true); }
})();
</script>
</body>
</html>
