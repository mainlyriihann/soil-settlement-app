<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soil Settlement</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --subcard: #fafaf8; --text: #1a211e; --muted: #626d67; --line: #e2e0d8;
    --accent: #256353; --accent-hover: #1d4f42; --accent-soft: #eaf3f0; --accent-text: #ffffff;
    --warn: #b44b22; --grid: #eceae2; --series2: #d96b27;
    --shadow: 0 2px 10px rgba(20, 30, 25, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121514; --card: #1a1f1d; --subcard: #212724; --text: #e8edea; --muted: #95a39b; --line: #2d3531;
      --accent: #52b79a; --accent-hover: #67c5aa; --accent-soft: #1d2e29; --accent-text: #0c1411;
      --warn: #e5875a; --grid: #252c28; --series2: #f09a54;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1060px; margin: 0 auto; padding: 32px 20px 56px; }
  header { margin-bottom: 20px; }
  h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 20px; box-shadow: var(--shadow); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 14px; align-items: end; }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  select, input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--subcard); color: var(--text); font: inherit; transition: border-color .15s, box-shadow .15s; }
  select:focus, input:focus { outline: none; border-color: var(--accent);
                              box-shadow: 0 0 0 3px rgba(37, 99, 83, 0.15); }
  button { width: 100%; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer;
           transition: background .15s, transform .05s; }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: wait; }
  #status { margin: 14px 0 0; min-height: 1.4em; font-size: .88rem; color: var(--muted);
            display: flex; align-items: center; gap: 6px; }
  #status:empty { display: none; }
  #status.error { color: var(--warn); white-space: pre-wrap; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 600;
           text-transform: uppercase; letter-spacing: 0.03em; background: var(--accent-soft);
           color: var(--accent); border: 1px solid var(--line); }
  #result { display: none; margin-top: 18px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .metric { background: var(--subcard); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .metric .k { font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .metric .v { font-size: 1.4rem; font-weight: 700; margin-top: 2px; color: var(--text); }
  .metric.primary { background: var(--accent-soft); border-color: var(--accent); }
  .metric.primary .v { color: var(--accent); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .chart-card { background: var(--subcard); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .chartbox { position: relative; height: 330px; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .dot-hint { font-size: .78rem; font-weight: 400; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
  .dot-hint::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--series2); display: inline-block; }
</style>
</head>
<body>
<main>
  <header>
    <h1>1D Soil Consolidation &amp; Settlement Calculator</h1>
    <p class="sub">Analytical Terzaghi solution — enter soil parameters to compute the U<sub>av</sub>–T<sub>v</sub> curve and settlement over time.</p>
  </header>

  <div class="card">
    <form id="form">
      <div><label for="ks">Permeability k<sub>s</sub> (m/s)</label><input id="ks" type="number" step="any" required></div>
      <div><label for="mv">Compressibility m<sub>v</sub> (m²/kN)</label><input id="mv" type="number" step="any" required></div>
      <div><label for="thickness">Soil thickness H (m)</label><input id="thickness" type="number" step="any" required></div>
      <div><label for="u0">Initial pore pressure u<sub>0</sub> (kN/m²)</label><input id="u0" type="number" step="any" required></div>
      <div><label for="drainage">Drainage condition</label><select id="drainage"></select></div>
      <div><label for="hours">Settlement after (hours)</label>
           <input id="hours" type="number" min="0" step="any" value="10"></div>
      <div><button id="go" type="submit">Calculate</button></div>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <div id="result" class="card">
    <div id="answer" class="metrics"></div>
    <div class="charts">
      <div class="chart-card">
        <h2><span>U<sub>av</sub> vs T<sub>v</sub></span><span class="dot-hint">Selected time</span></h2>
        <div class="chartbox"><canvas id="c1"></canvas></div>
      </div>
      <div class="chart-card">
        <h2><span>Settlement vs Time</span><span class="dot-hint">Selected time</span></h2>
        <div class="chartbox"><canvas id="c2"></canvas></div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let data = null, chart1 = null, chart2 = null, polling = null;

const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function setStatus(html, isError) {
  $("status").className = isError ? "error" : "";
  $("status").innerHTML = html;
}

// Linear interpolation on the stored (sorted) series.
function interp(x, xs, ys) {
  if (x <= xs[0]) return ys[0];
  if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
  let lo = 0, hi = xs.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; (xs[m] <= x ? (lo = m) : (hi = m)); }
  const f = (x - xs[lo]) / (xs[hi] - xs[lo]);
  return ys[lo] + f * (ys[hi] - ys[lo]);
}

function pairs(xs, ys) { return xs.map((x, i) => ({ x, y: ys[i] })); }

function baseOptions(xTitle, yTitle) {
  const grid = { color: css("--grid") }, ticks = { color: css("--muted") };
  const title = (t) => ({ display: true, text: t, color: css("--muted") });
  return {
    responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
    plugins: { legend: { display: false } },
    scales: { x: { type: "linear", title: title(xTitle), grid, ticks },
              y: { title: title(yTitle), grid, ticks } },
  };
}

function render() {
  if (!data) return;
  const tSeries = data.t_hours || (data.t_days ? data.t_days.map((d) => d * 24) : (data.t_years ? data.t_years.map((y) => y * 8766) : null));
  if (!tSeries) return;
  const x = parseFloat($("hours").value);
  const maxHours = data.max_hours ?? Math.floor(tSeries[tSeries.length - 1]);
  const valid = Number.isFinite(x) && x >= 0;
  const s = valid ? interp(x, tSeries, data.settlement) : null;

  const tEnd = tSeries[tSeries.length - 1];
  const hasT = valid && data.tv_t;
  const xc = Math.min(x, tEnd);
  const tvx = hasT ? interp(xc, tSeries, data.tv_t) : null;
  const uavx = hasT ? interp(xc, tSeries, data.uav_t) : null;
  const sFinal = data.settlement[data.settlement.length - 1];

  if (!valid) {
    $("answer").innerHTML = `<div class="metric"><div class="k">Notice</div><div class="v" style="font-size:1rem">Enter a valid time (0 or more hours).</div></div>`;
  } else {
    const timeLabel = x > tEnd ? `At ${maxHours} h (max)` : `After ${x} hour${x === 1 ? "" : "s"}`;
    $("answer").innerHTML = `
      <div class="metric primary"><div class="k">Settlement (${timeLabel})</div><div class="v">${s.toFixed(2)} mm</div></div>
      <div class="metric"><div class="k">Consolidation U<sub>av</sub></div><div class="v">${hasT ? (uavx * 100).toFixed(1) + " %" : "—"}</div></div>
      <div class="metric"><div class="k">Time Factor T<sub>v</sub></div><div class="v">${hasT ? tvx.toPrecision(3) : "—"}</div></div>
      <div class="metric"><div class="k">Ultimate Settlement S<sub>c</sub></div><div class="v">${sFinal.toFixed(2)} mm</div></div>
    `;
  }

  const accent = css("--accent"), marker = css("--series2");

  // chart 1: Uav vs Tv. Capped at 100% consolidation (end of data.tv) so it never drags along the bottom axis.
  if (chart1) chart1.destroy();
  const tvMaxCurve = data.tv[data.tv.length - 1];
  const tvPlot = hasT ? Math.min(tvx, tvMaxCurve) : null;
  const uavPlot = hasT ? (tvx >= tvMaxCurve ? data.uav[data.uav.length - 1] : uavx) : null;
  const o1 = baseOptions("Time factor, Tv (log scale)", "Average degree of consolidation, Uav");
  o1.scales.y.reverse = true;
  o1.scales.x = { ...o1.scales.x, type: "logarithmic", min: 1e-4, max: tvMaxCurve };
  const full = pairs(data.tv, data.uav);
  const sets1 = [{ data: full, borderColor: css("--line"), borderWidth: 2, pointRadius: 0 }];
  if (data.tv_emp) sets1.push({ data: pairs(data.tv_emp, data.uav_emp), borderColor: marker, borderWidth: 1.5,
                                borderDash: [6, 4], pointRadius: 0 });
  if (hasT) {
    const upto = full.filter((p) => p.x > 0 && p.x < tvPlot);
    upto.push({ x: tvPlot, y: uavPlot });
    sets1.push({ data: upto, borderColor: accent, borderWidth: 3, pointRadius: 0 });
    sets1.push({ data: [{ x: tvPlot, y: uavPlot }], type: "scatter", backgroundColor: marker, borderColor: marker, pointRadius: 6 });
  }
  chart1 = new Chart($("c1"), { type: "line", options: o1, data: { datasets: sets1 } });

  // chart 2: settlement vs time, stopped at 100% consolidation (uav >= 0.999) so the curve isn't squashed against t = 0
  if (chart2) chart2.destroy();
  let endIdx = tSeries.length - 1;
  if (data.uav_t) {
    const idx = data.uav_t.findIndex((u) => u >= 0.999);
    if (idx > 0) endIdx = idx;
  } else if (data.tv_t) {
    const idx = data.tv_t.findIndex((v) => v >= tvMaxCurve);
    if (idx > 0) endIdx = idx;
  }
  const tCurve = tSeries.slice(0, endIdx + 1);
  const sCurve = data.settlement.slice(0, endIdx + 1);
  const tMaxCurve = tCurve[tCurve.length - 1];
  const o2 = baseOptions("Time (hours)", "Settlement (mm)");
  o2.scales.y.reverse = true;
  o2.scales.x = { ...o2.scales.x, max: tMaxCurve };
  const sets = [{ data: pairs(tCurve, sCurve), borderColor: accent, borderWidth: 2, pointRadius: 0 }];
  if (valid) {
    const xPlot = Math.min(x, tMaxCurve);
    const sPlot = x >= tMaxCurve ? sCurve[sCurve.length - 1] : s;
    sets.push({ data: [{ x: xPlot, y: sPlot }],
                type: "scatter", backgroundColor: marker, borderColor: marker, pointRadius: 6 });
  }
  chart2 = new Chart($("c2"), { type: "line", options: o2, data: { datasets: sets } });

  $("result").style.display = "block";
}

function showCase(c) {
  if (c.status === "done") {
    clearInterval(polling); $("go").disabled = false;
    data = c.data;
    setStatus(c.cached
      ? `<span class="badge">from database</span>Stored result for this input.`
      : `<span class="badge">computed</span>New result generated and saved.`);
    render();
  } else if (c.status === "failed") {
    clearInterval(polling); $("go").disabled = false;
    setStatus("Calculation failed:\n" + (c.error || "unknown error"), true);
  } else {
    setStatus(`<span class="badge">${c.status === "running" ? "running" : "queued"}</span>` +
              `Not in the database yet - MATLAB is generating it. This page updates automatically.`);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  clearInterval(polling);
  $("go").disabled = true; setStatus("Checking the database...");
  try {
    const c = await api("/api/cases", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ks: +$("ks").value, mv: +$("mv").value, thickness: +$("thickness").value,
                            u0: +$("u0").value, drainage: $("drainage").value }) });
    showCase(c);
    if (c.status !== "done" && c.status !== "failed") {
      const cached = c.cached;
      polling = setInterval(async () => {
        try { showCase({ ...(await api("/api/cases/" + c.id)), cached }); }
        catch (err) { clearInterval(polling); $("go").disabled = false; setStatus(err.message, true); }
      }, 1500);
    }
  } catch (err) { $("go").disabled = false; setStatus(err.message, true); }
});

// Changing "hours" just re-reads the stored curve - no new request.
$("hours").addEventListener("input", render);

(async () => {
  try {
    const o = await api("/api/options");
    for (const [id, spec] of Object.entries(o.params)) $(id).value = spec.default;
    $("drainage").innerHTML = o.drainage_types.map((v) => `<option>${v}</option>`).join("");
    if (o.mode === "mock") setStatus("Demo mode: same maths computed in Python, MATLAB is not being used.");
  } catch (err) { setStatus("Cannot reach the backend: " + err.message, true); }
})();
</script>
</body>
</html>
